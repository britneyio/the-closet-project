# docker-compose.yml — orchestrates the multi-container local dev stack.
# `docker compose up` boots BOTH services below on a shared private network.

services:
  # ─── PostgreSQL with the pgvector extension preinstalled ───────────
  db:
    image: pgvector/pgvector:pg16      # official Postgres 16 image + pgvector
    env_file: .env                     # reads POSTGRES_DB / USER / PASSWORD
    volumes:
      - pgdata:/var/lib/postgresql/data  # persist DB across container restarts
    ports:
      - "5432:5432"                    # expose to host (handy for a GUI/psql); optional
    healthcheck:                       # lets `backend` wait until DB is truly ready
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─── Ollama: serves the BGE-M3 embedding model (OpenAI-compatible API) ──
  # Runs as its OWN service so the model isn't loaded inside each gunicorn
  # worker. Reached from `backend` at http://ollama:11434/v1 (service-name DNS).
  # First run: `docker compose exec ollama ollama pull bge-m3` to fetch the model.
  ollama:
    image: ollama/ollama
    volumes:
      - ollama:/root/.ollama           # persist pulled models across restarts
    ports:
      - "11434:11434"                  # optional: reach Ollama from the host too

  # ─── Django backend ───────────────────────────────────────────────
  backend:
    build:
      context: ./backend              # build using backend/Dockerfile
      args:
        INSTALL_DEV: "true"           # include dev-packages (pytest, ruff) in the local image

    command: python manage.py runserver 0.0.0.0:8000  # DEV override of the image's gunicorn CMD
    env_file: .env
    volumes:
      - ./backend:/app                 # mount source -> runserver auto-reloads on edits
    ports:
      - "8000:8000"                    # host:container -> reach the app at localhost:8000
    depends_on:
      db:
        condition: service_healthy     # don't start until db's healthcheck passes
      ollama:
        condition: service_started     # embedding endpoint reachable (model pulled separately)

# ─── Named volumes: managed by Docker, survive `down`/`up` ────────────
volumes:
  pgdata:
  ollama: