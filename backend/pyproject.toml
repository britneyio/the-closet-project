# Central config for Python dev tools (pytest + ruff).

[tool.pytest.ini_options]
# Tell pytest-django which settings to use and where to find tests.
DJANGO_SETTINGS_MODULE = "backend.settings"
python_files = ["test_*.py", "tests.py", "*_tests.py"]

[tool.ruff]
# Match a common line length; target our Python version.
line-length = 100
target-version = "py312"
# Don't lint auto-generated migrations.
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
# Rule sets (each code is a family of checks):
#   E, W  = pycodestyle Errors / Warnings — PEP 8 style (spacing, line length, etc.)
#   F     = Pyflakes — real bugs: undefined names, unused imports, etc.
#   I     = isort — import ordering / grouping.
#   ANN   = flake8-ANNotations — REQUIRE type hints on function/method signatures.
select = ["E", "W", "F", "I", "ANN"]
# flake8-ANNotations pragmatic ignores:
#   ANN002 = missing type for *args    — pass-through, not worth annotating.
#   ANN003 = missing type for **kwargs — pass-through, not worth annotating.
# ANN401 (disallow typing.Any) is intentionally NOT ignored: Any defeats the
# purpose of typing, so it must be a deliberate, justified choice.
ignore = ["ANN002", "ANN003"]

[tool.ruff.lint.per-file-ignores]
# Tests are pytest functions; requiring return/param annotations there is noise.
"**/tests.py" = ["ANN"]